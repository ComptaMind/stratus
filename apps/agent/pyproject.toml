[project]
name = "stratus-agent"
version = "0.1.0"
description = "Stratus AI fiscal agent — FEC classification, CA3 computation, EDI-TVA generation"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "langgraph>=0.2.0",
    "langchain-anthropic>=0.3.0",
    "anthropic>=0.40.0",
    "mistralai>=1.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.10.0",
    "httpx>=0.27.0",
    "asyncpg>=0.29.0",
    "redis[asyncio]>=5.0.0",
    "PyYAML>=6.0.0",
    "tiktoken>=0.7.0",
    "qdrant-client>=1.9.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "rank-bm25>=0.2.2",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.backends.legacy:build"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
